name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest -v

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # No Postgres service: gen_docs and gen_contract both read class
      # metadata and module constants only, never the database and never a
      # configured value.
      - name: Regenerate reference docs
        run: uv run python -m scripts.gen_docs

      - name: Fail if the generated docs are stale
        run: |
          git add -A guide/reference/
          git diff --cached --exit-code guide/reference/

      # The provisioning contract is vendored verbatim into the sibling
      # provisioning repository, so a stale copy here silently misinforms
      # the other repo's parity tests. This check is purely local -- no
      # sibling checkout, no pinned ref, no network -- because the producer
      # must never be blocked on the consumer.
      - name: Regenerate the provisioning contract
        run: uv run python -m scripts.gen_contract

      - name: Fail if the provisioning contract is stale
        run: |
          git add -A contracts/
          git diff --cached --exit-code contracts/

  pages:
    needs: [lint-and-test, docs]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # --strict turns a broken internal link into a build failure, which is
      # the only thing that keeps a growing guide's cross-links honest.
      - name: Build the guide
        run: uv run mkdocs build --strict

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
