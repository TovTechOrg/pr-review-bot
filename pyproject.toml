[project]
name = "pr-review-bot"
version = "0.1.0"
description = "Autonomous code-review engine — GitHub PR webhook -> LLM specialists -> PR comment"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pygithub>=2.4",
    "google-genai>=0.3",
    "httpx>=0.27",
    "groq>=1.5.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "python-dotenv>=1.0",
    "google-auth>=2.35",
    # Neither is imported directly by application code at root -- both are
    # transitive via pygithub. Declared explicitly anyway because
    # tests/test_github_app.py imports `requests` directly (to patch
    # PyGithub's own HTTP transport, per that file's own module docstring),
    # and pyjwt is kept pinned alongside it for the same reason PyGithub
    # needs it.
    "pyjwt>=2.13",
    "requests>=2.32",
    "python-multipart>=0.0.20",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["dashboard"]

[dependency-groups]
dev = [
    # Imported directly by tests/test_github_app.py to build a
    # real RSA key; transitive via pygithub[crypto] otherwise.
    "cryptography>=44.0",
    "mkdocs-material>=9.5",
    "playwright>=1.62.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "pyyaml>=6.0",
    "respx>=0.21",
    "ruff>=0.7",
    "testcontainers[postgres]>=4.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "dashboard/tests"]
pythonpath = ["."]
# Neither test directory carries an __init__.py (matching the
# pre-restructure convention), so under the default `prepend` import mode a
# future duplicate test-file basename across the two (e.g. a second
# test_config.py) would hit pytest's "import file mismatch" collection
# error. `importlib` mode imports each test file by its fully qualified
# path instead of inserting bare names onto sys.path, which sidesteps that
# collision without requiring every test directory to become a real
# package. See ISSUES.md's now-closed "No __init__.py in the four test
# directories" Parked Issue. (`--import-mode` has no dedicated ini_options
# key -- it's an addopts-only flag, folded into the addopts line below.)
# -n is a PINNED 4, deliberately not `auto`. Each xdist worker pays a full
# app-import startup cost (~1.25s here), which only pays for itself if the
# worker then has enough tests to run. On a 24-core machine `auto` spins 24
# workers and that fixed cost dominates a 20-45s workload: measured on the
# fast-iteration subset, `auto` took 45.2s versus 30.3s serial -- i.e. it made
# the design's own primary target metric SLOWER than no parallelism at all.
# `-n 4` measured 20.2s, the sweep's minimum (2 -> 20.4s, 8 -> 22.1s). See the
# 2026-08-19 test-suite-performance design doc's section 8 for the full table.
# Revisit the number if the suite grows by a large multiple; do not "restore"
# it to auto.
addopts = "-n 4 --dist=loadgroup --import-mode=importlib"
markers = [
    "db: transitively touches the shared Postgres via the db_url fixture (auto-applied by tests/conftest.py's pytest_collection_modifyitems hook, not meant to be added by hand)",
    "xdist_meta: exercises real xdist worker subprocess scheduling via pytester -- slow, excluded from the fast-iteration `-m` filter",
]
