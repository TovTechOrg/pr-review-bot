<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Review Engine — Dashboard</title>
<style>
  /* Self-hosted one-bit/pixel display face for headings and window titles
     only (Direction contract FORM) -- never for body/control text, where
     Operate mode's scanability requirement wins. Served from this app's own
     /static/fonts mount (main.py), not a third-party CDN: an unreachable
     Google Fonts request would otherwise silently revert the entire display
     voice with no indication, which is a real risk for a page whose job is
     "tell at a glance whether the bot is healthy." Press Start 2P has no
     Hebrew glyphs; the font-family fallback stack lets Hebrew text degrade
     per-character to the system sans automatically rather than breaking. */
  @font-face {
    font-family: "Press Start 2P";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url(/static/fonts/press-start-2p-v16-latin-regular.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122;
  }
  /* One-Bit Windowed Console -- see .impeccable/surfaces/dashboard.md for the
     direction contract this implements (seed b8b1d930). Near-monochrome ink
     on paper, ordered dither standing in for secondary surfaces, one amber
     signal reserved for alerts/active state. No radius, no shadow: this
     world's native chrome is a square window with a solid inverted title
     bar, not a soft card. */
  :root {
    --ink: #16150f;
    --paper: #f1efe6;
    --surface: #faf9f2;
    --line: #16150f;
    --muted: #5c5a4d;
    --signal: #a3550a;
    --dither-dot: rgba(22, 21, 15, 0.55);
    --dither-dot-soft: rgba(22, 21, 15, 0.22);
    --pixel-font: "Press Start 2P", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #ece9dd;
      --paper: #16150f;
      --surface: #201f18;
      --line: #ece9dd;
      --muted: #a6a293;
      --signal: #d98a34;
      --dither-dot: rgba(236, 233, 221, 0.2);
      --dither-dot-soft: rgba(236, 233, 221, 0.1);
    }
  }
  :root[data-theme="dark"] {
    --ink: #ece9dd;
    --paper: #16150f;
    --surface: #201f18;
    --line: #ece9dd;
    --muted: #a6a293;
    --signal: #d98a34;
    --dither-dot: rgba(236, 233, 221, 0.2);
    --dither-dot-soft: rgba(236, 233, 221, 0.1);
  }
  /* Back-compat aliases: unchanged selectors below still read the old names. */
  :root {
    --bg: var(--paper);
    --surface-2: var(--paper);
    --text: var(--ink);
    --text-muted: var(--muted);
    --border: var(--line);
    --accent: var(--signal);
    --ok: var(--ink);
    --fail: var(--signal);
    --sev-critical: var(--signal);
    --sev-high: var(--ink);
    --sev-medium: var(--muted);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    /* Ordered dither IS the desktop ground behind every floating window --
       a real, visible stipple, not a token defined and never used. Window
       bodies stay flat (below) so text content keeps full legibility. */
    background-image: radial-gradient(var(--dither-dot) 1px, transparent 1px);
    background-size: 11px 11px;
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  /* Baseline reset for every form control -- browsers default input/select/
     textarea/button/dialog to a UA-supplied white background + black text
     that ignores the page's color scheme entirely, which is what made every
     control glow white against the dark theme. */
  input, select, textarea, button {
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 0.4rem 0.6rem;
  }
  input[type="checkbox"], input[type="radio"] {
    width: auto;
    padding: 0;
    accent-color: var(--accent);
  }
  input[readonly] { opacity: 0.7; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  dialog {
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 1.25rem 1.5rem;
    max-width: min(90vw, 420px);
    /* Hard-edged, unblurred offset shadow -- real elevation without the
       soft blur a strict one-bit/dither material never uses (a blurred
       shadow is a smooth gradient in disguise). Fixed light-source
       direction, not mirrored under RTL: shadows read as physical, not
       text-flow-relative. */
    box-shadow: none;
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
  dialog > * { margin-top: 0.6rem; }
  dialog > *:first-child { margin-top: 0; }
  header.topbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  button.control {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    border-radius: 0;
    padding: 0.4rem 0.9rem;
    font-size: 0.9rem;
  }
  /* Pressing inverts -- the one-bit desktop's own state idiom, not a
     borrowed accent border. */
  button.control:hover { border-color: var(--line); background: var(--paper); }
  .side-nav { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .side-nav .nav-item.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .nav-item svg { width: 1.05rem; height: 1.05rem; display: block; flex: none; }
  button.control svg { width: 1.05rem; height: 1.05rem; display: block; flex: none; }
  /* Window chrome: every persistent panel is a titled window, not a card. */
  .win {
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: none;
    margin: 0 0.25rem 1.5rem 0;
  }
  .win-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--pixel-font);
    font-size: 0.6rem;
    line-height: 1.6;
    font-weight: 400;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 0.45rem 0.65rem;
  }
  .win-title .win-live {
    width: 0.4rem;
    height: 0.4rem;
    flex: none;
    background: var(--paper);
    opacity: 0.5;
    transition: background-color 0.3s ease, opacity 0.3s ease;
  }
  .win-title .win-live.is-live {
    background: var(--signal);
    opacity: 1;
    animation: signal-pulse 0.6s ease-out;
  }
  .win-body { padding: 0.85rem 1rem; }
  /* Traceable thread: a dashed connector between two windows that stand in a
     real pipeline relationship (here, Queue -> the specialists it feeds). */
  /* Owns the ENTIRE visual gap between the Queue window and the
     specialists row -- pulled up to cancel the Queue window's own
     margin-bottom, with no trailing margin of its own, so the dash spans
     the full space between the two borders rather than dangling short of
     the row below it. */
  .thread {
    height: 1.5rem;
    margin-block: -1.5rem 0;
    margin-inline-start: 1.5rem;
    border-inline-start: 2px dashed var(--muted);
    width: 0;
    transition: border-color 0.3s ease;
  }
  .thread.is-live { border-inline-start-color: var(--signal); }
  @keyframes signal-pulse {
    0% { transform: scale(1); }
    30% { transform: scale(1.8); }
    100% { transform: scale(1); }
  }
  .env-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0;
    box-shadow: none;
    padding: 0 1.25rem 1.25rem;
    margin: 0 0.25rem 1.75rem 0;
    max-width: 900px;
  }
  /* The section heading doubles as its window title bar -- same inverted
     chrome as .win-title, bled to the section's own outer edge. */
  .env-section h2 {
    margin: 0 -1.25rem 0.85rem;
    padding: 0.55rem 1.25rem;
    font-family: var(--pixel-font);
    font-size: 0.6rem;
    line-height: 1.6;
    font-weight: 400;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper);
  }
  #renderVarsTable { width: 100%; border-collapse: collapse; margin-bottom: 1rem; table-layout: fixed; }
  #renderVarsTable th, #renderVarsTable td { text-align: start; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
  #renderVarsTable th:first-child, #renderVarsTable td:first-child { width: 30%; word-break: break-word; }
  #renderVarsTable th:last-child, #renderVarsTable td:last-child { width: 5.5rem; }
  .env-value-cell { display: flex; align-items: center; gap: 0.5rem; }
  #renderVarsTable input.env-value-input { flex: 1 1 auto; min-width: 0; font-family: monospace; }
  #renderVarsTable select.env-value-input { flex: 1 1 auto; min-width: 0; }
  select:disabled { opacity: 0.7; }
  .field-error { color: var(--fail); font-size: 0.8rem; margin-top: 0.2rem; }
  .field-hint { color: var(--text-muted); font-size: 0.8rem; margin-top: 0.2rem; }
  .field-error .control { margin-inline-start: 0.4rem; padding: 0.15rem 0.5rem; font-size: 0.75rem; }
  /* Key cell: the var name plus an optional info icon+tooltip, matching the
     onboarding wizard's icon-button convention (ghost button, currentColor,
     theme tokens only -- no light/dark special-casing needed). */
  .key-cell { display: inline-flex; align-items: center; gap: 0.3rem; }
  .info-wrap { position: relative; display: inline-flex; }
  .info-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.4rem;
    height: 1.4rem;
    min-height: 0;
    padding: 0;
    background: none;
    border: none;
    border-radius: 0;
    color: var(--text-muted);
    cursor: help;
  }
  .info-icon:hover, .info-icon:focus-visible { color: var(--text); background: var(--surface-2); }
  .info-icon svg { width: 1rem; height: 1rem; display: block; }
  .info-tooltip {
    position: absolute;
    top: calc(100% + 0.3rem);
    inset-inline-start: 0;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 0.4rem 0.6rem;
    font-size: 0.8rem;
    font-weight: normal;
    line-height: 1.3;
    width: max-content;
    max-width: min(80vw, 320px);
    box-shadow: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.15s ease;
    pointer-events: none;
    z-index: 2;
  }
  .info-wrap:hover .info-tooltip, .info-wrap:focus-within .info-tooltip, .info-tooltip.show {
    opacity: 1;
    visibility: visible;
  }
  #addVarForm { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
  #addVarForm input { flex: 1 1 160px; min-width: 0; }
  .env-controls-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
  #configForm {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 0.6rem 0.75rem;
    align-items: center;
    max-width: 620px;
  }
  #configForm > * { min-width: 0; }
  /* A ruled group, like the config form's own rows above it -- not a boxed,
     dithered panel. Plain dashed hairlines between provider rows, matching
     .kv-row's separator idiom, instead of a nested "hollowed out" fill. */
  .provider-model-grid {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
  }
  .provider-model-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem 0.6rem;
    padding: 0.5rem 0;
    border-bottom: 1px dashed var(--border);
  }
  .provider-model-row:last-child { border-bottom: none; }
  .provider-model-row .provider-name {
    font-weight: 600;
    text-transform: capitalize;
    min-width: 4.5rem;
  }
  .provider-model-row label { color: var(--text-muted); font-size: 0.85rem; }
  .provider-model-row .cfg-key-slot { width: 4.5rem; flex: 0 0 auto; }
  .provider-model-row .cfg-model { flex: 1 1 180px; min-width: 0; }
  .provider-model-row .cfg-model-status { font-size: 0.85rem; color: var(--text-muted); }
  .popup-backdrop {
    position: fixed;
    inset: 0;
    background: transparent;
    display: none;
    z-index: 10;
  }
  .popup-backdrop.open { display: block; }
  .popup {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 1rem 1.25rem;
    min-width: 220px;
    max-width: min(90vw, 320px);
    box-shadow: none;
  }
  .popup h2 { margin: 0 0 0.75rem; font-size: 1rem; }
  .radio-group { display: flex; flex-direction: column; gap: 0.5rem; }
  .radio-group label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.35rem 0.25rem;
    cursor: pointer;
    font-size: 0.95rem;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 1rem 1rem 2.5rem; }
  h1 { font-family: var(--pixel-font); font-size: 1rem; line-height: 1.7; margin: 0.75rem 0 1.5rem; }
  /* Plain key:value rows -- retires the hero-metric big-number-on-a-card
     pattern (craft floor: "nested cards are always wrong"). A window's
     body is a list of facts, not a grid of stat tiles. */
  .kv-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.5rem 0.75rem;
    padding: 0.35rem 0;
    border-bottom: 1px dashed var(--border);
  }
  .kv-row:last-child { border-bottom: none; }
  .kv-label { color: var(--text-muted); font-size: 0.85rem; }
  .kv-value { font-weight: 600; }
  .kv-row-wrap { align-items: flex-start; }
  .tile-chip-list { display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .tile-chip {
    background: var(--surface);
    background-image: radial-gradient(var(--dither-dot-soft) 1px, transparent 1px);
    background-size: 6px 6px;
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 0.15rem 0.45rem;
    font-size: 0.8rem;
    white-space: nowrap;
  }
  /* Three specialist windows in a row -- each an independent titled window
     per the direction contract's FIRST VIEWPORT, not fields inside a card. */
  .specialists-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .spec-win { flex: 1 1 220px; min-width: 0; margin: 0 0.25rem 0 0; }
  .spec-win .win-body { min-height: 3.5rem; }
  #errorBanner {
    background: var(--surface);
    border: 1px solid var(--signal);
    color: var(--signal);
    font-weight: 600;
    border-radius: 0;
    padding: 0.6rem 0.9rem;
    margin-bottom: 1rem;
  }
  .review-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0;
    margin-bottom: 0.6rem;
    overflow: hidden;
  }
  .review-row {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem;
    padding: 0.7rem 1rem;
    padding-inline-end: 2.25rem;
    cursor: pointer;
  }
  .review-row .field { font-size: 0.85rem; }
  .review-row .field .field-value { font-weight: 500; }
  @media (max-width: 640px) {
    .review-row { flex-direction: column; align-items: stretch; }
    .review-row .field { display: flex; justify-content: space-between; width: 100%; }
    .review-row .field .field-label { color: var(--text-muted); }
  }
  /* Below this width, #renderVarsTable's 3 fixed-width columns (key 30%,
     actions 5.5rem) squeeze the value cell's input+button flex row to
     near-zero width --
     the input becomes effectively invisible, not just cramped. Same
     stacked-card technique .review-row already uses above: rows become
     self-labeled blocks instead of table columns. */
  @media (max-width: 640px) {
    #renderVarsTable { table-layout: auto; }
    #renderVarsTable thead { display: none; }
    #renderVarsTable, #renderVarsTable tbody, #renderVarsTable tr, #renderVarsTable td {
      display: block;
      width: auto;
    }
    #renderVarsTable tr {
      border: 1px solid var(--border);
      border-radius: 0;
      padding: 0.5rem 0.65rem;
      margin-bottom: 0.6rem;
    }
    #renderVarsTable td { border-bottom: none; padding: 0.25rem 0; }
    #renderVarsTable td:empty { display: none; }
    #renderVarsTable td:first-child { font-weight: 600; word-break: break-word; }
    .env-value-cell { flex-wrap: wrap; }
    #renderVarsTable input.env-value-input { flex: 1 1 100%; }
    /* #configForm's label/input pairs are separate grid items; collapsing
       to one column stacks each pair (label above its field) instead of
       squeezing every input into whatever's left after the widest label
       (e.g. "Usage cap reset (UTC)") claims the fixed max-content column. */
    #configForm { grid-template-columns: 1fr; }
  }
  .review-row .chevron {
    position: absolute;
    top: 0.75rem;
    inset-inline-end: 1rem;
    display: inline-block;
    transition: transform 0.15s ease;
  }
  .review-row[aria-expanded="true"] .chevron { transform: rotate(180deg); }
  .review-findings { display: none; border-top: 1px solid var(--border); padding: 0.75rem 1rem; }
  .review-card.expanded .review-findings { display: block; }
  .finding-group h3 { font-size: 0.85rem; margin: 0.5rem 0 0.25rem; }
  .finding { font-size: 0.85rem; padding: 0.35rem 0; border-bottom: 1px dashed var(--border); }
  .finding:last-child { border-bottom: none; }
  /* Severity ladder without a rainbow of hues: amber is reserved for the
     alert state (critical); weight and muting carry the rest. */
  .sev-critical { color: var(--sev-critical); font-weight: 600; }
  .sev-high { color: var(--sev-high); font-weight: 600; }
  .sev-medium { color: var(--sev-medium); font-weight: 400; }
  .status-ok { color: var(--ok); font-weight: 400; }
  .status-failed { color: var(--fail); font-weight: 600; }
  a.comment-link { color: var(--text); text-decoration: underline; }
</style>
</head>
<body>
  <header class="topbar">
    <button id="themeToggleBtn" class="control" type="button" aria-haspopup="dialog"></button>
    <button id="langToggleBtn" class="control" type="button" aria-haspopup="dialog"></button>
    <button id="logoutBtn" class="control" type="button" data-i18n="logout_label"></button>
  </header>

  <div id="themePopupBackdrop" class="popup-backdrop">
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="themePopupTitle">
      <h2 id="themePopupTitle"></h2>
      <div class="radio-group">
        <label><input type="radio" name="theme" value="light"> <span data-i18n="theme_light"></span></label>
        <label><input type="radio" name="theme" value="dark"> <span data-i18n="theme_dark"></span></label>
        <label><input type="radio" name="theme" value="system"> <span data-i18n="theme_system"></span></label>
      </div>
    </div>
  </div>

  <div id="langPopupBackdrop" class="popup-backdrop">
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="langPopupTitle">
      <h2 id="langPopupTitle"></h2>
      <div class="radio-group">
        <label><input type="radio" name="lang" value="en"> English</label>
        <label><input type="radio" name="lang" value="he"> עברית</label>
      </div>
    </div>
  </div>

  <main>
    <h1 data-i18n="dashboard_title"></h1>
    <nav class="side-nav">
      <button class="control nav-item active" type="button" data-panel="statusPanel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <span data-i18n="nav_status"></span>
      </button>
      <button class="control nav-item" type="button" data-panel="environmentPanel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/>
          <line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/>
          <line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/>
          <line x1="17" y1="16" x2="23" y2="16"/>
        </svg>
        <span data-i18n="nav_environment"></span>
      </button>
    </nav>
    <section id="statusPanel">
      <section id="errorBanner" hidden></section>
      <div class="win">
        <div class="win-title">
          <span data-i18n="win_queue"></span>
          <span id="systemLiveDot" class="win-live" aria-hidden="true"></span>
        </div>
        <div class="win-body">
          <section id="stats"></section>
        </div>
      </div>
      <!-- Traceable thread: the Queue feeds the specialists below it. Lights
           up amber only while a review is actually running -- a real signal
           read off queue.by_status.running, not a decoration. Per-specialist
           granularity (which specialist is running, not just "something
           is") isn't data the API exposes, so the thread joins Queue to the
           row as a whole -- see the surface brief's Unresolved decisions. -->
      <div id="reviewThread" class="thread" aria-hidden="true"></div>
      <div class="specialists-row">
        <div class="win spec-win">
          <div class="win-title">
            <span data-i18n="sp_name_security"></span>
            <span class="win-live" data-spec-dot="Security" aria-hidden="true"></span>
          </div>
          <div class="win-body" data-spec-body="Security"></div>
        </div>
        <div class="win spec-win">
          <div class="win-title">
            <span data-i18n="sp_name_performance"></span>
            <span class="win-live" data-spec-dot="Performance" aria-hidden="true"></span>
          </div>
          <div class="win-body" data-spec-body="Performance"></div>
        </div>
        <div class="win spec-win">

        KEY_USAGE_TOKEN_CAP: "תקרת שימוש יומית בטוקנים לכל מפתח. השארה ללא הגדרה מבטלת את התקרה כליל.",
        KEY_USAGE_RESET_TIME_UTC: "שעת UTC שבה תקרת השימוש היומית לכל מפתח מתאפסת.",
        UPTIMEROBOT_API_KEY: "מפתח UptimeRobot המשמש רק כלי הפעלה מקומיים על המחשב שלך — השירות הפרוס לעולם לא קורא אותו.",
        RENDER_API_KEY: "מפתח ה-API של Render שבו לוח הבקרה עצמו משתמש לקריאה/כתיבה של סביבת השירות הזה. מחיקתו תשאיר את לשונית הסביבה הזו תקועה.",
      },
    };

    const CREDENTIAL_SLOT_BASE_VARS = ["GEMINI_API_KEY", "GROQ_API_KEY", "GCP_SERVICE_ACCOUNT_KEY"];

    function envVarDescription(key) {
      let base = key;
      let slot = 0;
      for (const candidate of CREDENTIAL_SLOT_BASE_VARS) {
        if (key === candidate) { base = candidate; slot = 0; break; }
        const m = key.match(new RegExp(`^${candidate}_(\\d+)$`));
        if (m) { base = candidate; slot = Number(m[1]); break; }
      }
      const table = ENV_VAR_DESCRIPTIONS[currentLang] || ENV_VAR_DESCRIPTIONS.en;
      const text = table[base] || ENV_VAR_DESCRIPTIONS.en[base];
      if (!text) return null;
      return slot > 0 ? `${text} ${t("env_credential_slot_suffix").replace("{n}", String(slot))}` : text;
    }

    const SPECIALIST_KEY = {
      Security: "sp_name_security",
      Performance: "sp_name_performance",
      "Code Quality": "sp_name_quality",
    };

    // Authored SVGs, not emoji: same stroke convention as the nav-item and
    // info-icon glyphs (viewBox 0 0 24 24, stroke currentColor, width 2,
    // round caps) -- an emoji icon system reads as unauthored on every
    // screen, since these two buttons are in the fixed topbar throughout.
    const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="4.5" y1="4.5" x2="6.6" y2="6.6"/><line x1="17.4" y1="17.4" x2="19.5" y2="19.5"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/><line x1="4.5" y1="19.5" x2="6.6" y2="17.4"/><line x1="17.4" y1="6.6" x2="19.5" y2="4.5"/></svg>';
    const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
    const ICON_MONITOR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>';
    const ICON_GLOBE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>';
    const THEME_ICON = { light: ICON_SUN, dark: ICON_MOON, system: ICON_MONITOR };
    const LANG_LABEL = { en: "English", he: "עברית" };

    const KNOWN_LANGS = ["en", "he"];
    const KNOWN_THEMES = ["light", "dark", "system"];

    function readStoredLang() {
      const stored = localStorage.getItem("dashboard_lang");
      return KNOWN_LANGS.includes(stored) ? stored : "en";
    }

    function readStoredTheme() {
      const stored = localStorage.getItem("dashboard_theme");
      return KNOWN_THEMES.includes(stored) ? stored : "system";
    }

    let currentLang = readStoredLang();
    let currentTheme = readStoredTheme();

    function t(key) {
      return STRINGS[currentLang][key] || STRINGS.en[key] || key;
    }

    function esc(value) {
      return String(value).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    function applyTheme(theme) {
      currentTheme = theme;
      localStorage.setItem("dashboard_theme", theme);
      document.documentElement.setAttribute("data-theme", theme === "system" ? "" : theme);
      document.getElementById("themeToggleBtn").innerHTML =
        `${THEME_ICON[theme]}<span>${t("theme_" + theme)}</span>`;
      document.querySelector(`input[name="theme"][value="${theme}"]`).checked = true;
    }

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem("dashboard_lang", lang);
      document.documentElement.setAttribute("lang", lang);
      document.documentElement.setAttribute("dir", lang === "he" ? "rtl" : "ltr");
      document.getElementById("langToggleBtn").innerHTML = `${ICON_GLOBE}<span>${LANG_LABEL[lang]}</span>`;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t(el.getAttribute("data-i18n"));
      });
      document.getElementById("themePopupTitle").textContent = t("theme_popup_title");
      document.getElementById("langPopupTitle").textContent = t("lang_popup_title");
      document.querySelector(`input[name="lang"][value="${lang}"]`).checked = true;
      applyTheme(currentTheme); // refresh theme button label in the new language
      refreshDashboard();
    }

    const POLL_INTERVAL_MS = 4000;
    const expandedPrs = new Set();

    function renderStats(stats, queue) {
      const el = document.getElementById("stats");
      if (stats.error || queue.by_status?.error) {
        el.innerHTML = "";
        return;
      }
      const queueChips = Object.entries(queue.by_status || {})
        .map(([status, count]) => `<span class="tile-chip">${t("q_" + status)}: ${count}</span>`)
        .join("");
      const backoffEntries = Object.entries(queue.backoff || {}).filter(([, until]) => until);
      const backoffChips = backoffEntries.length
        ? backoffEntries
            .map(([provider, until]) =>
              `<span class="tile-chip">${esc(provider)} → ${new Date(until).toLocaleTimeString()}</span>`
            )
            .join("")
        : `<span class="tile-chip">${t("backoff_none")}</span>`;
      const rows = [
        [t("stat_total_reviews"), esc(String(stats.total_reviews)), false],
        [t("stat_total_cost"), `$${stats.total_cost_usd.toFixed(4)}`, false],
        [t("stat_avg_time"), `${(stats.avg_elapsed_ms / 1000).toFixed(1)}s`, false],
        [t("stat_queue"), `<span class="tile-chip-list">${queueChips}</span>`, true],
        [t("stat_provider_backoff"), `<span class="tile-chip-list">${backoffChips}</span>`, true],
      ];
      el.innerHTML = rows.map(([label, valueHtml, wrap]) => `
        <div class="kv-row${wrap ? " kv-row-wrap" : ""}">
          <span class="kv-label">${label}</span>
          <span class="kv-value">${valueHtml}</span>
        </div>
      `).join("");

      const running = Number(queue.by_status?.running || 0) > 0;
      document.getElementById("systemLiveDot").classList.toggle("is-live", running);
      document.getElementById("reviewThread").classList.toggle("is-live", running);
      // Activity.log is what a running review is actively populating --
      // same real signal as Queue/the thread, not a permanently-lit dot.
      document.getElementById("activityLiveDot").classList.toggle("is-live", running);
    }

    const SPECIALIST_NAMES = ["Security", "Performance", "Code Quality"];

    // Real data only: each specialist window reflects the most recent
    // review's own result for that specialist (already fetched for
    // Activity.log) -- there is no separate per-specialist aggregate
    // endpoint, so nothing here is invented beyond what's on screen anyway.
    function renderSpecialists(reviews) {
      const list = Array.isArray(reviews) ? reviews : [];
      const latest = list[0];
      SPECIALIST_NAMES.forEach((name) => {
        const body = document.querySelector(`[data-spec-body="${CSS.escape(name)}"]`);
        const dot = document.querySelector(`[data-spec-dot="${CSS.escape(name)}"]`);
        const spec = latest?.specialists?.find((s) => s.name === name);
        if (!spec) {
          body.innerHTML = `<div class="kv-row"><span class="kv-label">${t("empty_reviews")}</span></div>`;
          dot.classList.remove("is-live");
          return;
        }
        const isOk = spec.status === "ok";
        const statusClass = isOk ? "status-ok" : "status-failed";
        const statusText = isOk ? t("sp_ok") : t("sp_failed");
        const findingsCount = spec.findings ? spec.findings.length : 0;
        body.innerHTML = `
          <div class="kv-row">
            <span class="kv-label">${t("col_when")}</span>
            <span class="kv-value">${new Date(latest.created_at).toLocaleString()}</span>
          </div>
          <div class="kv-row">
            <span class="kv-label">${t("sp_status_label")}</span>
            <span class="kv-value ${statusClass}">${statusText}</span>
          </div>
          <div class="kv-row">
            <span class="kv-label">${t("sp_findings_label")}</span>
            <span class="kv-value">${findingsCount}</span>
          </div>
        `;
        // A specialist's own alert signal: it failed on the most recent
        // review. Not tied to "currently running" -- see the thread's own
        // comment for why that finer-grained signal isn't available.
        dot.classList.toggle("is-live", !isOk);
      });
    }

    function findingRows(specialist) {
      if (specialist.status === "failed") {
        return `<div class="finding">${esc(specialist.error || "")}</div>`;
      }
      if (!specialist.findings || !specialist.findings.length) {
        return `<div class="finding">${t("no_findings")}</div>`;
      }
      return specialist.findings.map((finding) => {
        const parts = [];
        if (finding.severity) {
          parts.push(`<span class="sev-${esc(finding.severity)}">${t("sev_" + finding.severity)}</span>`);
        }
        if (finding.estimated_impact) parts.push(esc(finding.estimated_impact));
        if (finding.category) parts.push(esc(finding.category));
        if (finding.type) parts.push(esc(finding.type));
        if (finding.file) parts.push(`${esc(finding.file)}:${esc(finding.line ?? "?")}`);
        const text = finding.description || finding.issue || finding.suggestion || "";
        const fix = finding.fix || finding.refactoring_suggestion || "";
        return `<div class="finding">${parts.join(" · ")} — ${esc(text)}${fix ? ` → ${esc(fix)}` : ""}</div>`;
      }).join("");
    }

    function renderReviews(reviews) {
      const el = document.getElementById("reviews");
      if (reviews.error) {
        el.innerHTML = "";
        return;
      }
      if (!reviews.length) {
        el.innerHTML = `<p>${t("empty_reviews")}</p>`;
        return;
      }
      el.innerHTML = reviews.map((review) => {
        const key = `${review.repo}#${review.pr_number}#${review.created_at}`;
        const isExpanded = expandedPrs.has(key);
        const statuses = review.specialists.map((s) =>
          `<span class="status-${esc(s.status)}">${t(SPECIALIST_KEY[s.name]) || esc(s.name)}: ${s.status === "ok" ? t("sp_ok") : t("sp_failed")}</span>`
        ).join(" · ");
        const findings = review.specialists.map((s) => `
          <div class="finding-group">
            <h3>${t(SPECIALIST_KEY[s.name]) || esc(s.name)}</h3>
            ${findingRows(s)}
          </div>
        `).join("");
        return `
          <div class="review-card${isExpanded ? " expanded" : ""}" data-key="${esc(key)}">
            <div class="review-row" role="button" tabindex="0" aria-expanded="${isExpanded}">
              <span class="field"><span class="field-label">${t("col_pr")}: </span><span class="field-value">#${review.pr_number}</span></span>
              <span class="field"><span class="field-label">${t("col_repo")}: </span><span class="field-value">${esc(review.repo)}</span></span>
              <span class="field"><span class="field-label">${t("col_provider")}: </span><span class="field-value">${esc(review.provider)}/${esc(review.model)}</span></span>
              <span class="field"><span class="field-label">${t("col_time")}: </span><span class="field-value">${(review.elapsed_ms / 1000).toFixed(1)}s</span></span>
              <span class="field"><span class="field-label">${t("col_tokens")}: </span><span class="field-value">${review.tokens_in}/${review.tokens_out}</span></span>
              <span class="field"><span class="field-label">${t("col_cost")}: </span><span class="field-value">${review.est_cost_usd === null ? "—" : `$${review.est_cost_usd.toFixed(4)}`}</span></span>
              <span class="field"><span class="field-label">${t("col_when")}: </span><span class="field-value">${new Date(review.created_at).toLocaleString()}</span></span>
              <span class="field">${statuses}</span>
              ${review.comment_url ? `<a class="comment-link field" href="${review.comment_url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${t("col_comment")}</a>` : ""}
              <span class="chevron">▾</span>
            </div>
            <div class="review-findings">${findings}</div>
          </div>
        `;
      }).join("");

      function toggleReviewCard(row) {
        const card = row.closest(".review-card");
        const key = card.getAttribute("data-key");
        const nowExpanded = !card.classList.contains("expanded");
        card.classList.toggle("expanded", nowExpanded);
        row.setAttribute("aria-expanded", String(nowExpanded));
        if (nowExpanded) expandedPrs.add(key); else expandedPrs.delete(key);
      }

      el.querySelectorAll(".review-row").forEach((row) => {
        row.addEventListener("click", () => toggleReviewCard(row));
        row.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            if (event.key === " ") event.preventDefault();
            toggleReviewCard(row);
          }
        });
      });
    }

    async function refreshDashboard() {
      const banner = document.getElementById("errorBanner");
      try {
        const response = await fetch("/api/dashboard");
        if (response.status === 401) {
          // Session expired (or was never valid) -- the error banner would
          // otherwise show a permanent, misleading "data unavailable" state
          // while polling a 401 every 4 seconds forever. Redirect straight
          // to /login instead of touching the banner at all.
          window.location.href = "/login";
          return;
        }
        const data = await response.json();
        const hasError = data.stats.error || data.queue.by_status.error || data.reviews.error;
        banner.hidden = !hasError;
        if (hasError) banner.textContent = t("error_banner");
        renderStats(data.stats, data.queue);
        renderSpecialists(data.reviews);
        renderReviews(data.reviews);
      } catch (err) {
        banner.hidden = false;
        banner.textContent = t("error_banner");
      }
    }

    function positionPopup(popup, anchorBtn) {
      const margin = 8;
      const rect = anchorBtn.getBoundingClientRect();
      const isRtl = document.documentElement.getAttribute("dir") === "rtl";
      popup.style.top = `${rect.bottom + margin}px`;
      popup.style.left = "auto";
      popup.style.right = "auto";
      const popupWidth = popup.offsetWidth;
      if (isRtl) {
        const maxRight = window.innerWidth - popupWidth - margin;
        const right = Math.min(Math.max(window.innerWidth - rect.right, margin), maxRight);
        popup.style.right = `${right}px`;
      } else {
        const maxLeft = window.innerWidth - popupWidth - margin;
        const left = Math.max(margin, Math.min(rect.left, maxLeft));
        popup.style.left = `${left}px`;
      }
    }

    function openPopup(id, anchorBtn) {
      closeAllPopups();
      const backdrop = document.getElementById(id);
      backdrop.classList.add("open");
      positionPopup(backdrop.querySelector(".popup"), anchorBtn);
    }

    function closeAllPopups() {
      document.querySelectorAll(".popup-backdrop").forEach((el) => el.classList.remove("open"));
    }

    document.getElementById("themeToggleBtn").addEventListener("click", (event) => openPopup("themePopupBackdrop", event.currentTarget));
    document.getElementById("langToggleBtn").addEventListener("click", (event) => openPopup("langPopupBackdrop", event.currentTarget));
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      try {
        await fetch("/api/logout", { method: "POST" });
      } finally {
        window.location.href = "/login";
      }
    });

    document.querySelectorAll(".popup-backdrop").forEach((backdrop) => {
      backdrop.addEventListener("click", (event) => {
        if (event.target === backdrop) closeAllPopups();
      });
    });

    document.querySelectorAll('input[name="theme"]').forEach((radio) => {
      radio.addEventListener("change", (event) => {
        applyTheme(event.target.value);
        closeAllPopups();
      });
    });

    document.querySelectorAll('input[name="lang"]').forEach((radio) => {
      radio.addEventListener("change", (event) => {
        applyLanguage(event.target.value);
        closeAllPopups();
      });
    });

    const LIST_SEPARATOR = ", ";   // named, not inlined -- avoids re-triggering
                                    // test_dashboard_page_renders_queue_and_backoff_as_chips_not_one_string's
                                    // literal join-call regression scan, which is unrelated to this use
    let renderVars = [];   // [{key, value, protected}], as last fetched
    const stagedEdits = new Map();   // key -> new value
    const stagedDeletes = new Set();
    const revealed = new Set();
    // Mirrors dashboard/environment.py's _DIRECT_EDIT_VARS, minus the
    // *_MODEL vars -- those are now <select>s fed by the live catalog (see
    // MODEL_PROVIDER_FOR_VAR below) and can't hold an invalid value in the
    // first place, so they no longer need blur-time validation here.
    const DIRECT_EDIT_VARS = new Set(["GCP_PROJECT", "GCP_LOCATION"]);

    const MODEL_PROVIDER_FOR_VAR = { LLM_MODEL: "gemini", GROQ_MODEL: "groq", VERTEX_MODEL: "vertex" };

    // Per-provider live model list, fetched once whenever the Environment
    // tab is switched into (see the nav-item click handler) and reused by
    // both the render-vars table's model rows and the config panel's model
    // rows -- one fetch feeds both surfaces.
    let modelCatalog = {
      gemini: { status: "idle", models: [], error: null },
      groq: { status: "idle", models: [], error: null },
      vertex: { status: "idle", models: [], error: null },
    };

    async function loadModelCatalog(provider) {
      modelCatalog[provider] = { status: "loading", models: [], error: null };
      renderRenderVarsTable();
      renderProviderModelRows();
      let data;
      try {
        const resp = await fetch(`/api/environment/credential/${provider}/models`);
        data = await resp.json();
      } catch {
        data = { ok: false, models: null, error: "network_error" };
      }
      modelCatalog[provider] = data.ok
        ? { status: "ok", models: data.models || [], error: null }
        : { status: "error", models: [], error: data.error };
      renderRenderVarsTable();
      renderProviderModelRows();
    }

    function loadAllModelCatalogs() {
      return Promise.all(Object.keys(modelCatalog).map(loadModelCatalog));
    }

    // Options for a *_MODEL <select>: the live catalog when loaded, plus the
    // currently-set value pinned in even if the catalog doesn't (currently)
    // contain it -- e.g. a deprecated/renamed model -- so the field is never
    // silently forced to change out from under whatever is actually set.
    function modelOptionsHtml(provider, currentValue) {
      const cat = modelCatalog[provider];
      if (cat.status === "ok") {
        const list = !currentValue || cat.models.includes(currentValue)
          ? cat.models
          : [currentValue, ...cat.models];
        return list.map((m) => `<option value="${esc(m)}" ${m === currentValue ? "selected" : ""}>${esc(m)}</option>`).join("");
      }
      return currentValue
        ? `<option value="${esc(currentValue)}" selected>${esc(currentValue)}</option>`
        : "";
    }

    function modelStatusHtml(provider) {
      const cat = modelCatalog[provider];
      if (cat.status === "loading") return `<div class="field-hint">${t("env_validating")}</div>`;
      if (cat.status === "error") {
        // "no_credential_configured" for a provider with zero credential
        // vars set anywhere isn't a failure -- it's the normal state of a
        // provider nobody has set up yet (most deployments only use one of
        // the three). Only flag it red+Retry when a credential DOES exist
        // somewhere but the catalog fetch still failed (wrong key, network,
        // an actually-misconfigured slot) -- that's a real problem worth
        // surfacing.
        const configuredAnywhere = (currentAvailableKeySlots[provider] || []).length > 0;
        if (cat.error === "no_credential_configured" && !configuredAnywhere) return "";
        return `<div class="field-error">* ${t("env_model_load_failed")} (${esc(cat.error)})
          <button type="button" class="control model-retry" data-provider="${provider}">${t("env_retry")}</button>
        </div>`;
      }
      return "";
    }

    // Var name plus an optional info-icon tooltip -- a var with no entry in
    // ENV_VAR_DESCRIPTIONS just renders as plain text, no icon.
    function keyCellHtml(key) {
      const desc = envVarDescription(key);
      if (!desc) return `<span class="key-cell">${esc(key)}</span>`;
      return `
        <span class="key-cell">
          ${esc(key)}
          <span class="info-wrap">
            <button type="button" class="info-icon" data-action="info" aria-label="${esc(t("env_info_label"))}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/>
                <line x1="12" y1="11" x2="12" y2="16"/>
                <circle cx="12" cy="7.5" r="0.75" fill="currentColor" stroke="none"/>
              </svg>
            </button>
            <span class="info-tooltip" role="tooltip">${esc(desc)}</span>
          </span>
        </span>
      `;
    }

    function maskedValue(value) {
      return "•".repeat(Math.min(value.length, 24)) || "—";
    }

    function renderRenderVarsTable() {
      const tbody = document.querySelector("#renderVarsTable tbody");
      const rows = renderVars
        .filter((v) => !stagedDeletes.has(v.key))
        .map((v) => {
          const displayValue = stagedEdits.has(v.key) ? stagedEdits.get(v.key) : v.value;
          const deleteBtn = v.protected
            ? ""
            : `<button type="button" class="control" data-action="delete" data-key="${esc(v.key)}">${t("env_delete")}</button>`;
          const provider = MODEL_PROVIDER_FOR_VAR[v.key];
          if (provider) {
            const disabled = modelCatalog[provider].status !== "ok";
            return `
              <tr data-key="${esc(v.key)}">
                <td>${keyCellHtml(v.key)}</td>
                <td>
                  <div class="env-value-cell">
                    <select class="env-value-input model-select" data-key="${esc(v.key)}"
                      data-provider="${provider}" ${disabled ? "disabled" : ""}>
                      ${modelOptionsHtml(provider, displayValue)}
                    </select>
                  </div>
                  ${modelStatusHtml(provider)}
                </td>
                <td>${deleteBtn}</td>
              </tr>
            `;
          }
          const isRevealed = revealed.has(v.key);
          return `
            <tr data-key="${esc(v.key)}">
              <td>${keyCellHtml(v.key)}</td>
              <td>
                <div class="env-value-cell">
                  <input type="text" class="env-value-input" data-key="${esc(v.key)}"
                    value="${esc(isRevealed ? displayValue : maskedValue(displayValue))}"
                    ${isRevealed ? "" : "readonly"}>
                  <button type="button" class="control" data-action="reveal" data-key="${esc(v.key)}">
                    ${isRevealed ? t("env_hide") : t("env_reveal")}
                  </button>
                </div>
                <div class="field-error" data-error-for="${esc(v.key)}" hidden></div>
              </td>
              <td>${deleteBtn}</td>
            </tr>
          `;
        });
      tbody.innerHTML = rows.join("");

      tbody.querySelectorAll('[data-action="reveal"]').forEach((btn) => {
        btn.addEventListener("click", () => {
          const key = btn.getAttribute("data-key");
          if (revealed.has(key)) revealed.delete(key); else revealed.add(key);
          renderRenderVarsTable();
        });
      });
      tbody.querySelectorAll('[data-action="delete"]').forEach((btn) => {
        btn.addEventListener("click", async () => {
          const key = btn.getAttribute("data-key");
          const resp = await fetch(`/api/environment/render/${key}`, { method: "DELETE" });
          if (resp.status === 409) {
            const data = await resp.json();
            document.getElementById("deleteConfirmList").innerHTML =
              data.dependents.map((d) => `<li>${esc(d)}</li>`).join("");
            const modal = document.getElementById("deleteConfirmModal");
            modal.dataset.key = key;
            modal.showModal();
            return;
          }
          await fetchEnvironmentRender();
          await fetchEnvironmentConfig();
        });
      });
      tbody.querySelectorAll('[data-action="info"]').forEach((btn) => {
        btn.addEventListener("click", (event) => {
          event.stopPropagation();
          const tooltip = btn.nextElementSibling;
          const wasShown = tooltip.classList.contains("show");
          document.querySelectorAll(".info-tooltip.show").forEach((el) => el.classList.remove("show"));
          if (!wasShown) tooltip.classList.add("show");
        });
      });
      tbody.querySelectorAll(".model-retry").forEach((btn) => {
        btn.addEventListener("click", () => loadModelCatalog(btn.getAttribute("data-provider")));
      });
      tbody.querySelectorAll("select.model-select").forEach((select) => {
        select.addEventListener("change", () => {
          stagedEdits.set(select.getAttribute("data-key"), select.value);
        });
      });
      tbody.querySelectorAll(".env-value-input:not([readonly]):not(.model-select)").forEach((input) => {
        input.addEventListener("input", () => {
          stagedEdits.set(input.getAttribute("data-key"), input.value);
        });
        const key = input.getAttribute("data-key");
        if (DIRECT_EDIT_VARS.has(key)) {
          input.addEventListener("blur", async () => {
            const resp = await fetch(`/api/environment/validate/${key}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ value: input.value }),
            });
            const result = await resp.json();
            const errorEl = tbody.querySelector(`[data-error-for="${key}"]`);
            if (result.ok) {
              invalidRenderFields.delete(key);
              if (errorEl) errorEl.hidden = true;
            } else {
              invalidRenderFields.add(key);
              if (errorEl) {
                errorEl.hidden = false;
                errorEl.textContent = `* ${t("env_field_invalid").replace("{key}", key)} (${result.error})`;
              }
            }
            updateSaveGuards();
          });
        }
      });
    }

    async function fetchEnvironmentRender() {
      const resp = await fetch("/api/environment/render");
      if (resp.status === 401) { window.location.href = "/login"; return; }
      const data = await resp.json();
      renderVars = data.vars;
      currentAvailableKeySlots = data.available_key_slots || currentAvailableKeySlots;
      stagedEdits.clear();
      stagedDeletes.clear();
      invalidRenderFields.clear();
      updateSaveGuards();
      renderRenderVarsTable();
    }

    async function pollUntilDashboardRecovers() {
      const banner = document.getElementById("deployBanner");
      const deadline = Date.now() + 5 * 60 * 1000;
      while (Date.now() < deadline) {
        await new Promise((resolve) => setTimeout(resolve, 5000));
        try {
          const resp = await fetch("/api/dashboard");
          if (resp.ok) { banner.hidden = true; return; }
        } catch (err) { /* connection dropped mid-redeploy -- keep polling */ }
      }
      banner.hidden = true;
    }

    async function saveRenderVars() {
      if (invalidRenderFields.size > 0) {
        document.getElementById("renderSaveResult").textContent = t("env_fix_before_save");
        return;
      }
      const sets = {};
      stagedEdits.forEach((value, key) => { sets[key] = value; });
      const deletes = Array.from(stagedDeletes);
      const resp = await fetch("/api/environment/render", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sets, deletes }),
      });
      const result = await resp.json();
      const resultEl = document.getElementById("renderSaveResult");
      resultEl.textContent =
        `applied: ${result.applied.join(LIST_SEPARATOR) || "-"}; failed: ${result.failed.map((f) => `${f.key} (${f.error})`).join(LIST_SEPARATOR) || "-"}`;
      if (result.deploy_id) {
        document.getElementById("deployBanner").hidden = false;
        document.getElementById("deployBanner").textContent = t("env_redeploying");
        pollUntilDashboardRecovers();
      }
      await fetchEnvironmentRender();
      await fetchEnvironmentConfig();
    }

    let guidedValidatedPayload = null;

    function arrayBufferToBase64(buffer) {
      // btoa() only accepts Latin1 -- a service-account JSON or PEM could in
      // principle contain a byte outside that range (e.g. a non-ASCII
      // comment), which would throw InvalidCharacterError and silently make
      // Apply do nothing. Build the base64 string from raw bytes instead.
      const bytes = new Uint8Array(buffer);
      let binary = "";
      for (let i = 0; i < bytes.length; i += 1) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    function guidedSlotSelectFor(family) {
      const used = currentAvailableKeySlots[family] || [];
      let defaultSlot = 0;
      for (let i = 0; i < 5; i += 1) {
        if (!used.includes(i)) { defaultSlot = i; break; }
      }
      const options = [0, 1, 2, 3, 4]
        .map((i) => `<option value="${i}" ${i === defaultSlot ? "selected" : ""}>${i}${used.includes(i) ? " *" : ""}</option>`)
        .join("");
      return `<label>${t("env_config_key_slot")}</label><select id="guidedSlotSelect">${options}</select>`;
    }

    function guidedModalBodyFor(family) {
      if (family === "gemini" || family === "groq") {
        return `<input type="password" id="guidedApiKey" placeholder="API key">${guidedSlotSelectFor(family)}`;
      }
      if (family === "vertex") {
        return `<input type="file" id="guidedCredentialFile" accept=".json">${guidedSlotSelectFor(family)}`;
      }
      return `
        <input type="text" id="guidedAppId" placeholder="App ID">
        <input type="file" id="guidedCredentialFile" accept=".pem">
      `;
    }

    // Everything a successful Validate produced -- the derived block, the
    // remembered payload, the enabled Apply button. Called before every
    // Validate attempt and whenever the inputs it was derived FROM change,
    // so no repeat interaction can leave a second copy of the block behind
    // or let Apply act on a credential that is no longer the one on screen.
    function resetGuidedValidation() {
      guidedValidatedPayload = null;
      document.getElementById("guidedApplyBtn").disabled = true;
      document.getElementById("guidedModalResult").textContent = "";
      document.getElementById("guidedModalExtra").innerHTML = "";
    }

    document.getElementById("guidedSetupSelect").addEventListener("change", (event) => {
      const family = event.target.value;
      if (!family) return;
      resetGuidedValidation();
      document.getElementById("guidedModalBody").innerHTML = guidedModalBodyFor(family);
      document.getElementById("guidedModal").dataset.family = family;
      document.getElementById("guidedModal").showModal();
    });

    // Editing the credential itself invalidates the validation it produced --
    // otherwise Apply would still send the previously validated file/key
    // while the picker visibly shows a different one. The key-slot select is
    // exempt: it is not part of what was validated, so changing it must not
    // force another live provider call.
    document.getElementById("guidedModalBody").addEventListener("input", (event) => {
      if (event.target.id === "guidedSlotSelect") return;
      resetGuidedValidation();
    });

    document.getElementById("guidedValidateBtn").addEventListener("click", async () => {
      const family = document.getElementById("guidedModal").dataset.family;
      const resultEl = document.getElementById("guidedModalResult");
      const validateBtn = document.getElementById("guidedValidateBtn");
      const applyBtn = document.getElementById("guidedApplyBtn");
      resetGuidedValidation();
      // Disabled for the whole request, not just while awaiting fetch: a
      // second click before the first response lands would fire a second
      // live provider-validation call, and could race the first response's
      // guidedValidatedPayload assignment.
      validateBtn.disabled = true;
      try {
        const formData = new FormData();
        if (family === "gemini" || family === "groq") {
          const apiKey = document.getElementById("guidedApiKey").value;
          if (!apiKey) { resultEl.textContent = t("env_guided_missing_input"); return; }
          formData.append("api_key", apiKey);
        } else if (family === "vertex") {
          // files[0] is undefined with nothing picked, and FormData would
          // append the string "undefined" -- a 422 whose body has no `error`
          // field, rendering as a bare "✗ invalid: undefined". Catch it here
          // instead, which also skips a pointless live provider call.
          const file = document.getElementById("guidedCredentialFile").files[0];
          if (!file) { resultEl.textContent = t("env_guided_missing_input"); return; }
          formData.append("credential_file", file);
        } else {
          const appId = document.getElementById("guidedAppId").value;
          const file = document.getElementById("guidedCredentialFile").files[0];
          if (!appId || !file) { resultEl.textContent = t("env_guided_missing_input"); return; }
          formData.append("app_id", appId);
          formData.append("credential_file", file);
        }
        const resp = await fetch(`/api/environment/credential/${family}/validate`, {
          method: "POST",
          body: formData,
        });
        const result = await resp.json();
        if (!result.ok) {
          resultEl.textContent = `${t("env_invalid")}: ${result.error}`;
          return;
        }
        if (family !== "github_app" && (result.models || []).length === 0) {
          // A valid credential whose catalog comes back empty would leave the
          // model <select> with zero options, and Apply would then post
          // model:"" -- which Render rejects, so only the credential var lands
          // and the model var silently fails. Refuse to get there.
          resultEl.textContent = t("env_guided_no_models");
          return;
        }
        guidedValidatedPayload = { family, result, raw: formData };
        let extra = "";
        if (family !== "github_app") {
          const options = (result.models || []).map((m) => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
          extra += `<label>${t("env_config_model")}</label><select id="guidedModelSelect">${options}</select>`;
        }
        if (result.conflicts && result.conflicts.length > 0) {
          const c = result.conflicts[0];
          extra += `<p>${t("env_guided_project_conflict").replace("{current}", esc(c.current)).replace("{new}", esc(c.new))}</p>`;
          extra += `
            <label><input type="radio" name="projectChoice" value="keep" checked> ${t("env_guided_keep_project")}</label>
            <label><input type="radio" name="projectChoice" value="clear"> ${t("env_guided_clear_project")}</label>
          `;
        }
        if (family === "github_app") {
          extra += `<label>${t("env_guided_installation_label")}</label><span>${result.installation_id}</span>`;
        }
        document.getElementById("guidedModalExtra").innerHTML = extra;
        resultEl.textContent = t("env_valid");
      } finally {
        validateBtn.disabled = false;
        // Mirrors resetGuidedValidation's own invariant -- only enable Apply
        // when a validation actually succeeded (guidedValidatedPayload set),
        // never unconditionally.
        applyBtn.disabled = !guidedValidatedPayload;
      }
    });

    document.getElementById("guidedApplyBtn").addEventListener("click", async () => {
      if (!guidedValidatedPayload) return;
      const { family, result } = guidedValidatedPayload;
      const validateBtn = document.getElementById("guidedValidateBtn");
      const applyBtn = document.getElementById("guidedApplyBtn");
      // Disabled for the whole request: a second click before the first
      // response lands would push the same credential/model twice and could
      // trigger two Render deploys.
      validateBtn.disabled = true;
      applyBtn.disabled = true;
      try {
        let body;
        if (family === "github_app") {
          const fileBuffer = await guidedValidatedPayload.raw.get("credential_file").arrayBuffer();
          body = {
            app_id: document.getElementById("guidedAppId").value,
            private_key_b64: arrayBufferToBase64(fileBuffer),
            installation_id: result.installation_id,
          };
        } else {
          const model = document.getElementById("guidedModelSelect").value;
          const slot = parseInt(document.getElementById("guidedSlotSelect").value, 10);
          let credential;
          if (family === "vertex") {
            const fileBuffer = await guidedValidatedPayload.raw.get("credential_file").arrayBuffer();
            credential = { service_account_b64: arrayBufferToBase64(fileBuffer) };
          } else {
            credential = { api_key: guidedValidatedPayload.raw.get("api_key") };
          }
          const clearChoice = document.querySelector('input[name="projectChoice"]:checked');
          body = {
            slot,
            credential,
            model,
            clear_gcp_project: Boolean(clearChoice && clearChoice.value === "clear"),
          };
        }
        const resp = await fetch(`/api/environment/credential/${family}/apply`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const result2 = await resp.json();
        // Report into #renderSaveResult, NOT #guidedModalResult: the latter
        // lives inside the <dialog>, so close() below hid it the instant it
        // was written and a partial apply ("failed: VERTEX_MODEL") was never
        // visible at all -- leaving the refreshed var table, which shows one
        // added row, as the operator's only feedback.
        document.getElementById("renderSaveResult").textContent =
          `applied: ${(result2.applied || []).join(LIST_SEPARATOR) || "-"}; failed: ${(result2.failed || []).map((f) => `${f.key} (${f.error})`).join(LIST_SEPARATOR) || "-"}`;
        document.getElementById("guidedModal").close();
        await fetchEnvironmentRender();
        await fetchEnvironmentConfig();
      } finally {
        validateBtn.disabled = false;
        // dialog close() (above) already ran resetGuidedValidation via the
        // 'close' listener on success, which disabled this button -- mirror
        // that invariant instead of unconditionally re-enabling it.
        applyBtn.disabled = !guidedValidatedPayload;
      }
    });

    document.getElementById("guidedCancelBtn").addEventListener("click", () => {
      document.getElementById("guidedModal").close();
    });

    // On the dialog's own close event, not per-button: Escape (and any other
    // dismissal the browser handles itself) closes it without running the
    // Cancel handler, which used to leave guidedSetupSelect stuck on the
    // chosen family -- re-picking that same option then fires no `change`,
    // so guided setup could not be reopened for it at all.
    document.getElementById("guidedModal").addEventListener("close", () => {
      document.getElementById("guidedSetupSelect").value = "";
      resetGuidedValidation();
    });

    document.getElementById("deleteConfirmOkBtn").addEventListener("click", async () => {
      const modal = document.getElementById("deleteConfirmModal");
      const key = modal.dataset.key;
      await fetch(`/api/environment/render/${key}?confirm=true`, { method: "DELETE" });
      modal.close();
      await fetchEnvironmentRender();
      await fetchEnvironmentConfig();
    });

    document.getElementById("deleteConfirmCancelBtn").addEventListener("click", () => {
      document.getElementById("deleteConfirmModal").close();
    });

    document.getElementById("addVarForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const keyInput = document.getElementById("newVarKey");
      const valueInput = document.getElementById("newVarValue");
      if (!keyInput.value) return;
      renderVars = renderVars.filter((v) => v.key !== keyInput.value);
      renderVars.push({ key: keyInput.value, value: valueInput.value, protected: false });
      stagedEdits.set(keyInput.value, valueInput.value);
      revealed.add(keyInput.value);
      keyInput.value = "";
      valueInput.value = "";
      renderRenderVarsTable();
    });

    document.getElementById("saveRenderVarsBtn").addEventListener("click", saveRenderVars);

    const LLM_PROVIDERS = ["gemini", "groq", "vertex"];
    let currentConfig = { model: {}, key_index: {} };
    let currentAvailableKeySlots = { gemini: [], groq: [], vertex: [] };
    // Scoped separately so an invalid GCP_PROJECT/GCP_LOCATION field edited
    // directly in the render-vars table only blocks the render-vars Save
    // button, never the config panel's Save button (or vice versa).
    const invalidRenderFields = new Set();
    const invalidConfigFields = new Set();

    function updateSaveGuards() {
      document.getElementById("saveRenderVarsBtn").disabled = invalidRenderFields.size > 0;
      document.getElementById("saveConfigBtn").disabled = invalidConfigFields.size > 0;
    }

    function renderProviderModelRows() {
      const container = document.getElementById("providerModelRows");
      container.innerHTML = LLM_PROVIDERS.map((provider) => {
        const slots = currentAvailableKeySlots[provider] || [];
        const currentSlot = currentConfig.key_index[provider] ?? "";
        const currentModel = currentConfig.model[provider] || "";
        const slotOptions = slots
          .map((s) => `<option value="${s}" ${String(s) === String(currentSlot) ? "selected" : ""}>${s}</option>`)
          .join("");
        const disabled = modelCatalog[provider].status !== "ok";
        // A blank leading option means "no override" -- distinct from the
        // live catalog's own entries, and always available even while the
        // catalog is loading/unavailable so the field can still be cleared.
        const modelOptions = `<option value=""></option>${modelOptionsHtml(provider, currentModel)}`;
        return `
          <div class="provider-model-row" data-provider="${provider}">
            <span class="provider-name">${esc(provider)}</span>
            <label>${t("env_config_key_slot")}</label>
            <select data-provider="${provider}" class="cfg-key-slot">
              <option value="">—</option>
              ${slotOptions}
            </select>
            <label>${t("env_config_model")}</label>
            <select class="cfg-model" data-provider="${provider}" ${disabled ? "disabled" : ""}>
              ${modelOptions}
            </select>
            <span class="cfg-model-status" data-provider="${provider}">${modelStatusHtml(provider)}</span>
          </div>
        `;
      }).join("");

      container.querySelectorAll(".model-retry").forEach((btn) => {
        btn.addEventListener("click", () => loadModelCatalog(btn.getAttribute("data-provider")));
      });
    }

    function populateConfigForm(cfg) {
      document.getElementById("cfgProvider").value = cfg.provider || "";
      document.getElementById("cfgCooldownBase").value = cfg.cooldown_base_seconds ?? "";
      document.getElementById("cfgCooldownMax").value = cfg.cooldown_max_seconds ?? "";
      document.getElementById("cfgCooldownFactor").value = cfg.cooldown_factor ?? "";
      document.getElementById("cfgUsageCapTokens").value = cfg.usage_cap_tokens ?? "";
      document.getElementById("cfgUsageCapReset").value = cfg.usage_cap_reset ?? "";
      document.getElementById("cfgReviewDraftPrs").checked = Boolean(cfg.review_draft_prs);
      currentConfig = { model: cfg.model || {}, key_index: cfg.key_index || {} };
      invalidConfigFields.clear();
      updateSaveGuards();
      renderProviderModelRows();
    }

    async function fetchEnvironmentConfig() {
      const resp = await fetch("/api/environment/config");
      if (resp.status === 401) { window.location.href = "/login"; return; }
      populateConfigForm(await resp.json());
    }

    async function saveConfig() {
      if (invalidConfigFields.size > 0) {
        document.getElementById("configSaveResult").textContent = t("env_fix_before_save");
        return;
      }
      const body = {
        provider: document.getElementById("cfgProvider").value || null,
        cooldown_base_seconds: parseFloat(document.getElementById("cfgCooldownBase").value) || null,
        cooldown_max_seconds: parseFloat(document.getElementById("cfgCooldownMax").value) || null,
        cooldown_factor: parseFloat(document.getElementById("cfgCooldownFactor").value) || null,
        usage_cap_tokens: parseInt(document.getElementById("cfgUsageCapTokens").value, 10) || null,
        usage_cap_reset: document.getElementById("cfgUsageCapReset").value || null,
        review_draft_prs: document.getElementById("cfgReviewDraftPrs").checked,
        model: {},
        key_index: {},
      };
      // Always set every provider's field (never conditional on truthiness)
      // so blanking a model input or resetting a key-slot select to "—"
      // actually clears the override server-side, instead of the field
      // being silently omitted and the stale override left in place.
      document.querySelectorAll(".cfg-model").forEach((input) => {
        const provider = input.getAttribute("data-provider");
        body.model[provider] = input.value || null;
      });
      document.querySelectorAll(".cfg-key-slot").forEach((select) => {
        const provider = select.getAttribute("data-provider");
        body.key_index[provider] = select.value !== "" ? parseInt(select.value, 10) : null;
      });
      const resp = await fetch("/api/environment/config", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const result = await resp.json();
      document.getElementById("configSaveResult").textContent =
        `applied: ${result.applied.join(LIST_SEPARATOR) || "-"}; failed: ${result.failed.map((f) => `${f.key} (${f.error})`).join(LIST_SEPARATOR) || "-"}`;
    }

    document.getElementById("saveConfigBtn").addEventListener("click", saveConfig);

    // Closing any open info-tooltip on an outside click/tap -- the tooltips
    // themselves are toggled open by their own info-icon click handler
    // (see keyCellHtml/renderRenderVarsTable), never by this listener.
    document.addEventListener("click", () => {
      document.querySelectorAll(".info-tooltip.show").forEach((el) => el.classList.remove("show"));
    });

    document.querySelectorAll(".nav-item").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const alreadyActive = btn.classList.contains("active");
        document.querySelectorAll(".nav-item").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const targetId = btn.getAttribute("data-panel");
        document.getElementById("statusPanel").hidden = targetId !== "statusPanel";
        document.getElementById("environmentPanel").hidden = targetId !== "environmentPanel";
        // Refetch every time the Environment tab is switched into (not on a
        // repeat click while it's already active) -- Render env vars and
        // runtime_config can change from outside this page (another
        // operator, a script), so a stale in-memory copy from an earlier
        // visit to this tab shouldn't linger for the rest of the session.
        if (targetId === "environmentPanel" && !alreadyActive) {
          await fetchEnvironmentRender();
          await fetchEnvironmentConfig();
          await loadAllModelCatalogs();
        }
      });
    });

    applyLanguage(currentLang);
    setInterval(refreshDashboard, POLL_INTERVAL_MS);
  </script>
</body>
</html>
