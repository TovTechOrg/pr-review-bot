<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Review Engine — Login</title>
<style>
  /* Self-hosted one-bit/pixel display face -- see dashboard.html for the
     full rationale (served from this app's own /static/fonts mount, not a
     third-party CDN; Hebrew falls back per-character to the system sans
     automatically). */
  @font-face {
    font-family: "Press Start 2P";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url(/static/fonts/press-start-2p-v16-latin-regular.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122;
  }
  /* One-Bit Windowed Console -- same tokens as dashboard.html. See
     .impeccable/surfaces/dashboard.md for the direction contract. */
  :root {
    --ink: #16150f;
    --paper: #f1efe6;
    --surface: #faf9f2;
    --line: #16150f;
    --muted: #5c5a4d;
    --signal: #a3550a;
    --dither-dot: rgba(22, 21, 15, 0.55);
    --pixel-font: "Press Start 2P", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #ece9dd;
      --paper: #16150f;
      --surface: #201f18;
      --line: #ece9dd;
      --muted: #a6a293;
      --signal: #d98a34;
      --dither-dot: rgba(236, 233, 221, 0.2);
    }
  }
  :root[data-theme="dark"] {
    --ink: #ece9dd;
    --paper: #16150f;
    --surface: #201f18;
    --line: #ece9dd;
    --muted: #a6a293;
    --signal: #d98a34;
    --dither-dot: rgba(236, 233, 221, 0.2);
  }
  :root {
    --bg: var(--paper);
    --surface-2: var(--paper);
    --text: var(--ink);
    --text-muted: var(--muted);
    --border: var(--line);
    --accent: var(--signal);
    --ok: var(--ink);
    --fail: var(--signal);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    background-image: radial-gradient(var(--dither-dot) 1px, transparent 1px);
    background-size: 11px 11px;
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  header.topbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  button.control {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 0.4rem 0.9rem;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button.control svg { width: 1.05rem; height: 1.05rem; display: block; flex: none; }
  button.control:hover { border-color: var(--line); }
  .popup-backdrop {
    position: fixed;
    inset: 0;
    background: transparent;
    display: none;
    z-index: 10;
  }
  .popup-backdrop.open { display: block; }
  .popup {
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 1rem 1.25rem;
    min-width: 220px;
    max-width: min(90vw, 320px);
    box-shadow: none;
  }
  .popup h2 { margin: 0 0 0.75rem; font-size: 1rem; }
  .radio-group { display: flex; flex-direction: column; gap: 0.5rem; }
  .radio-group label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.35rem 0.25rem;
    cursor: pointer;
    font-size: 0.95rem;
  }
  main.login-main { max-width: 360px; margin: 12vh auto 0; padding: 0 1rem; }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0;
    box-shadow: none;
  }
  /* The login card is a window: its title doubles as the title bar,
     inverted ink-on-paper like every other window in this system. */
  h1.login-title {
    font-family: var(--pixel-font);
    font-size: 0.6rem;
    line-height: 1.6;
    font-weight: 400;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin: 0 0 1.25rem;
    padding: 0.55rem 1.5rem;
    text-align: start;
    background: var(--ink);
    color: var(--paper);
  }
  .field-group { margin-bottom: 1rem; padding-inline: 1.5rem; }
  .field-group:last-of-type { margin-bottom: 0; }
  .remember-row { padding-inline: 1.5rem; }
  form#loginForm { padding-bottom: 1.5rem; }
  #loginError { padding-inline: 1.5rem; }
  label.field-label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 0.3rem;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 0.5rem 0.6rem;
    border: 1px solid var(--border);
    border-radius: 0;
    background: var(--surface);
    color: var(--text);
    font-size: 0.95rem;
  }
  /* Password input with the reveal control sitting inside it -- mirrors
     onboarding/static/index.html's .password-field pattern. Logical
     properties (inset-inline-end / padding-inline-end) put the control on
     the correct side automatically under the Hebrew RTL direction. */
  .password-field { position: relative; }
  .password-field input { padding-inline-end: 2.75rem; }
  .password-toggle {
    position: absolute;
    inset-inline-end: 0.35rem;
    top: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.25rem;
    min-height: 0;
    padding: 0;
    background: none;
    border: none;
    border-radius: 0;
    color: var(--text-muted);
    cursor: pointer;
  }
  .password-toggle:hover { color: var(--text); }
  .password-toggle svg { width: 1.15rem; height: 1.15rem; display: block; }
  .password-toggle svg[hidden] { display: none; }
  .remember-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1rem;
    font-size: 0.9rem;
  }
  /* Pressing inverts: the one filled control on this page is solid ink, not
     the alert-reserved amber signal -- there is nothing to alert on here. */
  button.submit-btn {
    width: calc(100% - 3rem);
    margin-inline: 1.5rem;
    padding: 0.6rem;
    border: 1px solid var(--ink);
    border-radius: 0;
    background: var(--ink);
    color: var(--paper);
    font-size: 0.95rem;
    cursor: pointer;
  }
  button.submit-btn:hover { background: var(--muted); border-color: var(--muted); }
  #loginError { color: var(--fail); font-size: 0.85rem; margin-top: 0.75rem; padding-bottom: 1.5rem; text-align: start; font-weight: 600; }
  #loginError:empty { display: none; padding-bottom: 0; }
</style>
</head>
<body>
  <header class="topbar">
    <button id="themeToggleBtn" class="control" type="button" aria-haspopup="dialog"></button>
    <button id="langToggleBtn" class="control" type="button" aria-haspopup="dialog"></button>
  </header>

  <div id="themePopupBackdrop" class="popup-backdrop">
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="themePopupTitle">
      <h2 id="themePopupTitle"></h2>
      <div class="radio-group">
        <label><input type="radio" name="theme" value="light"> <span data-i18n="theme_light"></span></label>
        <label><input type="radio" name="theme" value="dark"> <span data-i18n="theme_dark"></span></label>
        <label><input type="radio" name="theme" value="system"> <span data-i18n="theme_system"></span></label>
      </div>
    </div>
  </div>

  <div id="langPopupBackdrop" class="popup-backdrop">
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="langPopupTitle">
      <h2 id="langPopupTitle"></h2>
      <div class="radio-group">
        <label><input type="radio" name="lang" value="en"> English</label>
        <label><input type="radio" name="lang" value="he"> עברית</label>
      </div>
    </div>
  </div>

  <main class="login-main">
    <div class="login-card">
      <h1 class="login-title" data-i18n="login_title"></h1>
      <form id="loginForm">
        <div class="field-group">
          <label class="field-label" for="usernameInput" data-i18n="username_label"></label>
          <input type="text" id="usernameInput" name="username" autocomplete="username" required>
        </div>
        <div class="field-group">
          <label class="field-label" for="passwordInput" data-i18n="password_label"></label>
          <div class="password-field">
            <input type="password" id="passwordInput" name="password" autocomplete="current-password" required>
            <button id="passwordToggleBtn" class="password-toggle" type="button">
              <svg id="passwordEyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="passwordEyeClosed" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="remember-row">
          <input type="checkbox" id="rememberInput" name="remember">
          <label for="rememberInput" data-i18n="remember_label"></label>
        </div>
        <button type="submit" class="submit-btn" data-i18n="submit_label"></button>
        <div id="loginError" role="alert"></div>
      </form>
    </div>
  </main>

  <script>
    const STRINGS = {
      en: {
        login_title: "Sign in",
        username_label: "Username",
        password_label: "Password",
        remember_label: "Remember me",
        submit_label: "Sign in",
        show_password_button: "Show",
        hide_password_button: "Hide",
        error_invalid_credentials: "Incorrect username or password.",
        error_network: "Could not reach the server. Check your connection and try again.",
        theme_light: "Light",
        theme_dark: "Dark",
        theme_system: "System",
        theme_popup_title: "Theme",
        lang_popup_title: "Language",
      },
      he: {
        login_title: "התחברות",
        username_label: "שם משתמש",
        password_label: "סיסמה",
        remember_label: "זכור אותי",
        submit_label: "התחבר",
        show_password_button: "הצג",
        hide_password_button: "הסתר",
        error_invalid_credentials: "שם משתמש או סיסמה שגויים.",
        error_network: "לא ניתן היה להתחבר לשרת. בדקו את החיבור ונסו שוב.",
        theme_light: "בהיר",
        theme_dark: "כהה",
        theme_system: "מערכת",
        theme_popup_title: "עיצוב",
        lang_popup_title: "שפה",
      },
    };

    // Authored SVGs, not emoji -- see dashboard.html for the full rationale.
    const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="4.5" y1="4.5" x2="6.6" y2="6.6"/><line x1="17.4" y1="17.4" x2="19.5" y2="19.5"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/><line x1="4.5" y1="19.5" x2="6.6" y2="17.4"/><line x1="17.4" y1="6.6" x2="19.5" y2="4.5"/></svg>';
    const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
    const ICON_MONITOR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>';
    const ICON_GLOBE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>';
    const THEME_ICON = { light: ICON_SUN, dark: ICON_MOON, system: ICON_MONITOR };
    const LANG_LABEL = { en: "English", he: "עברית" };

    const KNOWN_LANGS = ["en", "he"];
    const KNOWN_THEMES = ["light", "dark", "system"];

    function readStoredLang() {
      const stored = localStorage.getItem("dashboard_lang");
      return KNOWN_LANGS.includes(stored) ? stored : "en";
    }

    function readStoredTheme() {
      const stored = localStorage.getItem("dashboard_theme");
      return KNOWN_THEMES.includes(stored) ? stored : "system";
    }

    let currentLang = readStoredLang();
    let currentTheme = readStoredTheme();

    function t(key) {
      return STRINGS[currentLang][key] || STRINGS.en[key] || key;
    }

    function applyTheme(theme) {
      currentTheme = theme;
      localStorage.setItem("dashboard_theme", theme);
      document.documentElement.setAttribute("data-theme", theme === "system" ? "" : theme);
      document.getElementById("themeToggleBtn").innerHTML =
        `${THEME_ICON[theme]}<span>${t("theme_" + theme)}</span>`;
      document.querySelector(`input[name="theme"][value="${theme}"]`).checked = true;
    }

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem("dashboard_lang", lang);
      document.documentElement.setAttribute("lang", lang);
      document.documentElement.setAttribute("dir", lang === "he" ? "rtl" : "ltr");
      document.getElementById("langToggleBtn").innerHTML = `${ICON_GLOBE}<span>${LANG_LABEL[lang]}</span>`;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t(el.getAttribute("data-i18n"));
      });
      document.getElementById("themePopupTitle").textContent = t("theme_popup_title");
      document.getElementById("langPopupTitle").textContent = t("lang_popup_title");
      document.querySelector(`input[name="lang"][value="${lang}"]`).checked = true;
      applyTheme(currentTheme);
      setPasswordVisibility(passwordVisible); // refreshes the toggle's aria-label/title in the new language
    }

    let passwordVisible = false;

    function setPasswordVisibility(visible) {
      passwordVisible = visible;
      document.getElementById("passwordInput").type = visible ? "text" : "password";
      // The control is an icon, so its label lives in aria-label/title rather
      // than in text -- the strings stay translated, just not rendered.
      const toggle = document.getElementById("passwordToggleBtn");
      const label = t(visible ? "hide_password_button" : "show_password_button");
      toggle.setAttribute("aria-label", label);
      toggle.setAttribute("title", label);
      toggle.setAttribute("aria-pressed", visible ? "true" : "false");
      // Icon describes the click action, not the current state: eye ("click
      // to reveal") while hidden, crossed-out eye ("click to hide") once
      // shown. Toggling the `hidden` *attribute* directly, not the `.hidden`
      // IDL property -- some browsers don't reflect that property back onto
      // SVGElement (unlike HTMLElement), which silently no-ops the CSS
      // `svg[hidden] { display: none }` rule and leaves both icons stacked
      // on top of each other with neither ever visually swapping.
      document.getElementById("passwordEyeOpen").toggleAttribute("hidden", visible);
      document.getElementById("passwordEyeClosed").toggleAttribute("hidden", !visible);
    }

    document.getElementById("passwordToggleBtn").addEventListener("click", () => {
      setPasswordVisibility(!passwordVisible);
      // Clicking the toggle moves focus to the button itself -- return it to
      // the password field so typing can continue without an extra click,
      // caret at the end rather than wherever focus() alone would leave it.
      const input = document.getElementById("passwordInput");
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    });

    function positionPopup(popup, anchorBtn) {
      const margin = 8;
      const rect = anchorBtn.getBoundingClientRect();
      const isRtl = document.documentElement.getAttribute("dir") === "rtl";
      popup.style.top = `${rect.bottom + margin}px`;
      popup.style.left = "auto";
      popup.style.right = "auto";
      const popupWidth = popup.offsetWidth;
      if (isRtl) {
        const maxRight = window.innerWidth - popupWidth - margin;
        const right = Math.min(Math.max(window.innerWidth - rect.right, margin), maxRight);
        popup.style.right = `${right}px`;
      } else {
        const maxLeft = window.innerWidth - popupWidth - margin;
        const left = Math.max(margin, Math.min(rect.left, maxLeft));
        popup.style.left = `${left}px`;
      }
    }

    function openPopup(id, anchorBtn) {
      closeAllPopups();
      const backdrop = document.getElementById(id);
      backdrop.classList.add("open");
      positionPopup(backdrop.querySelector(".popup"), anchorBtn);
    }

    function closeAllPopups() {
      document.querySelectorAll(".popup-backdrop").forEach((el) => el.classList.remove("open"));
    }

    document.getElementById("themeToggleBtn").addEventListener("click", (event) => openPopup("themePopupBackdrop", event.currentTarget));
    document.getElementById("langToggleBtn").addEventListener("click", (event) => openPopup("langPopupBackdrop", event.currentTarget));

    document.querySelectorAll(".popup-backdrop").forEach((backdrop) => {
      backdrop.addEventListener("click", (event) => {
        if (event.target === backdrop) closeAllPopups();
      });
    });

    document.querySelectorAll('input[name="theme"]').forEach((radio) => {
      radio.addEventListener("change", (event) => {
        applyTheme(event.target.value);
        closeAllPopups();
      });
    });

    document.querySelectorAll('input[name="lang"]').forEach((radio) => {
      radio.addEventListener("change", (event) => {
        applyLanguage(event.target.value);
        closeAllPopups();
      });
    });

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const errorEl = document.getElementById("loginError");
      errorEl.textContent = "";
      const username = document.getElementById("usernameInput").value;
      const password = document.getElementById("passwordInput").value;
      const remember = document.getElementById("rememberInput").checked;
      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password, remember }),
        });
        const data = await response.json();
        if (data.valid) {
          window.location.href = "/";
        } else {
          errorEl.textContent = t("error_invalid_credentials");
        }
      } catch (err) {
        errorEl.textContent = t("error_network");
      }
    });

    applyLanguage(currentLang);
  </script>
</body>
</html>
