services:
  - type: web
    name: pr-review-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    # Docs-only changes (README, SPEC, CLAUDE.md, ISSUES.md, docs/**)
    # never affect what's actually deployed. An ignore-list (not an
    # include-list) is deliberate: anything NOT explicitly excluded here
    # still triggers a deploy by default, so a forgotten update here costs
    # one avoidable redeploy, never a real change silently failing to
    # deploy.
    buildFilter:
      ignoredPaths:
        - "**/*.md"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DASHBOARD_SESSION_SECRET
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: GITHUB_TARGET_REPO
        sync: false
      - key: GITHUB_APP_INSTALLATION_ID
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_1
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: VERTEX_GCP_SERVICE_ACCOUNT_KEY
        sync: false
      - key: VERTEX_GCP_SERVICE_ACCOUNT_KEY_1
        sync: false
      - key: VERTEX_GCP_SERVICE_ACCOUNT_KEY_2
        sync: false
