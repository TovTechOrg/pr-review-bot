site_name: PR Review Engine
site_description: Autonomous code-review engine — deploy your own
site_url: https://tovtechorg.github.io/pr-review-bot/
docs_dir: guide
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Switch to light mode}
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Home: index.md
  - Setup:
      - Overview: setup/index.md
      - 1. Prerequisites: setup/01-prerequisites.md
      - 2. Create the GitHub App: setup/02-github-app.md
      - 3. Install the App: setup/03-install-app.md
      - 4. Create the Supabase project: setup/04-supabase.md
      - 5. Configure an LLM provider: setup/05-llm-provider.md
      - 6. Create the Render service: setup/06-render.md
      - 7. Sync config and verify: setup/07-sync.md
      - 8. Add the keep-warm pinger: setup/08-pinger.md
  - Operations:
      - Deploying and verifying: operations/deploy.md
      - Switching providers and keys: operations/overrides.md
      - Tuning cooldowns and usage caps: operations/tuning.md
      - Deploying an image: operations/image-deploys.md
      - Config files: operations/config-files.md
  - Background:
      - Provider history: background/providers.md
  - Reference:
      - Configuration: reference/config.md
      - Model pricing: reference/pricing.md
      - Deployment checks: reference/checks.md
      - What --sync-env pushes: reference/sync-env.md
